[project]
name = "pl-analytics-dashboard"
version = "0.1.0"
description = "Dashboard interactivo de analítica de la Premier League, construido con Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.0",
    "plotly>=5.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["C408"]  # dict(...) is the idiomatic Plotly style used throughout app.py
